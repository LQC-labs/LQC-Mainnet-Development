name: MN-001 isolated SDK JS offline tests
on:
  push:
    branches: [integration/mn001-v29-validation-20261117]
    paths:
      - 'sdk/js/**'
      - '.github/workflows/mn001-sdk-js-offline.yml'
permissions:
  contents: read
jobs:
  sdk-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
      - name: Validate network config without dependencies or network calls
        working-directory: sdk/js
        run: npm test
