name: MN-001 isolated Flow MVP dependency gate
on:
  push:
    branches: [integration/mn001-v29-validation-20261117]
    paths:
      - 'tools/flow-mvp/package.json'
      - 'tools/flow-mvp/package-lock.json'
      - '.github/workflows/mn001-flow-mvp-dependencies.yml'
permissions:
  contents: read
jobs:
  dependency-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
      - name: Install pinned dependencies without lifecycle scripts
        working-directory: tools/flow-mvp
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.16.0
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import { version } from 'ethers'; if (version !== '6.17.0') process.exit(1); console.log(version)"
      - name: Offline ethers ABI and address smoke test (no RPC, signing, or deployment)
        working-directory: tools/flow-mvp
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Interface, getAddress, ZeroAddress } from 'ethers';
          const iface = new Interface(['function transfer(address to,uint256 amount) returns (bool)']);
          const recipient = '0x1000000000000000000000000000000000000001';
          const encoded = iface.encodeFunctionData('transfer', [recipient, 1000n]);
          const decoded = iface.decodeFunctionData('transfer', encoded);
          assert.equal(decoded[0], getAddress(recipient));
          assert.equal(decoded[1], 1000n);
          assert.notEqual(decoded[0], ZeroAddress);
          console.log('offline ethers ABI smoke PASS; no network or transaction');
          NODE
