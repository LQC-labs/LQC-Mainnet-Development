name: LQC Core current-source Linux checks

on:
  push:
    branches: [dev/lqc-core, integration/mn001-v29-validation-20261117]
  pull_request:
    branches: [main, dev/lqc-core]

permissions:
  contents: read

concurrency:
  group: lqc-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      CC: gcc
      CXX: g++
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: ''
      GOMAXPROCS: '2'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
      # CI performs bounded unit/regression checks, never starts consensus.
      LQC_RUN_NATIVE_EVM: '0'
      LQC_RUN_EVM_CONTRACT: '0'
      LQC_RUN_EVMRPC_INTEGRATION: '0'
      LQC_RUN_RESTART_REGRESSION: '0'
      LQC_RUN_ADMISSION_REGRESSION: '0'
      LQC_RUN_FLOW_MINIMAL: '0'
      LQC_RUN_CLUSTER: '0'
      LQC_REQUIRE_FLOW_ASSETS: '0'
      LQC_FLOW_ASSET_ROOT: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.9'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
      - name: Check pinned toolchain and current source
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.25.9
          test "$(go env GOOS)" = linux
          test "$(node --version)" = v22.16.0
          gcc --version | head -n 1
          g++ --version | head -n 1
          test -f app/persistent.go
          test -f node/evmrpc_contract.go
          test -f node/evm_transaction_integration_test.go
          test -f node/evm_contract_integration_test.go
      - name: Test and build current Core source
        run: |
          set -euo pipefail
          manifest="$(mktemp "$RUNNER_TEMP/lqc-dependencies.XXXXXXXX")"
          sha256sum go.mod go.sum > "$manifest"
          trap 'sha256sum --check "$manifest"' EXIT
          # MN-001 reviewed allowlist and compile-only gate; do not execute lqcd.
          bash scripts/security-preflight-linux.sh
  node-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
      - name: Check pinned Node runtime
        run: test "$(node --version)" = v22.16.0
      - name: Check Flow adapter regressions (not full dApp integration)
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/flow-quote-adapter.test.mjs | tee "$RUNNER_TEMP/lqc-flow.tap"
          grep -Eq '^# tests 25$' "$RUNNER_TEMP/lqc-flow.tap"
          grep -Eq '^# pass 25$' "$RUNNER_TEMP/lqc-flow.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/lqc-flow.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/lqc-flow.tap"
      - name: Check local Devnet profile boundaries (no network or signing)
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/flow-devnet-profile.test.mjs | tee "$RUNNER_TEMP/lqc-devnet-profile.tap"
          grep -Eq '^# tests 40$' "$RUNNER_TEMP/lqc-devnet-profile.tap"
          grep -Eq '^# pass 40$' "$RUNNER_TEMP/lqc-devnet-profile.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/lqc-devnet-profile.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/lqc-devnet-profile.tap"
