name: MN-001 approval gate - manual evidence review (NO-GO)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mn001-approval-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      LQC_MN001_OFFLINE_TEST_APPROVED: '0'
    steps:
      - name: Report independent isolation and authorization blockers
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'NETWORK_ISOLATION=BLOCKED'
          printf '%s\n' 'MN001_GATE=NO_GO'
          printf '%s\n' 'Manual evidence review only. No candidate execution is authorized.'
          printf '%s\n' 'No independent VM isolation or explicit approval proof attached.'
          exit 1
