name: MN-001 reviewed security preflight (not approval)

on:
  push:
    branches:
      - integration/mn001-offline-gate-hardening-20261119

permissions:
  contents: read

concurrency:
  group: mn001-offline-gate-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      LQC_MN001_OFFLINE_TEST_APPROVED: '0'
      LQC_RUN_NATIVE_EVM: '0'
      LQC_RUN_EVM_CONTRACT: '0'
      LQC_RUN_EVMRPC_INTEGRATION: '0'
      LQC_RUN_RESTART_REGRESSION: '0'
      LQC_RUN_ADMISSION_REGRESSION: '0'
      LQC_RUN_FLOW_MINIMAL: '0'
      LQC_RUN_CLUSTER: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.9'
          cache: false
      - name: Verify local Linux toolchain and script syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = linux
          test "$(go env GOVERSION)" = go1.25.9
          bash -n scripts/security-preflight-linux.sh
          bash -n scripts/mn001-offline-regression-candidate.sh
      - name: Verify offline candidate remains dry-run
        shell: bash
        run: |
          set -euo pipefail
          output="$(bash scripts/mn001-offline-regression-candidate.sh)"
          printf '%s\n' "$output"
          grep -Fq 'no tests executed' <<< "$output"
      - name: Verify forced approval is blocked without invoking Go
        shell: bash
        run: |
          set -euo pipefail
          # Use a PATH shim to detect any attempted Go invocation. This does
          # not run candidate tests, even if a future regression reaches Go.
          probe_dir="$(mktemp -d)"
          trap 'rm -rf -- "$probe_dir"' EXIT
          cat > "$probe_dir/go" <<'SH'
          #!/usr/bin/env bash
          printf 'invoked\n' >> "$LQC_GO_PROBE_LOG"
          exit 99
          SH
          chmod 700 "$probe_dir/go"
          export LQC_GO_PROBE_LOG="$probe_dir/go-invocations"
          output_file="$probe_dir/blocked-output"
          if PATH="$probe_dir:$PATH" GITHUB_ACTIONS=false LQC_MN001_OFFLINE_TEST_APPROVED=1 \
            bash scripts/mn001-offline-regression-candidate.sh >"$output_file" 2>&1; then
            printf '%s\n' 'ERROR: forced approval unexpectedly succeeded.' >&2
            exit 1
          fi
          cat "$output_file"
          grep -Fq 'candidate execution remains BLOCKED' "$output_file"
          if [[ -e "$LQC_GO_PROBE_LOG" ]]; then
            printf '%s\n' 'ERROR: Go invocation attempted despite fail-closed gate.' >&2
            exit 1
          fi
      - name: Verify inventory-only Linux isolation capability report
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/mn001-isolation-capability-inventory.sh
          report="$(bash scripts/mn001-isolation-capability-inventory.sh)"
          printf '%s\n' "$report"
          grep -Fxq 'RESULT=INVENTORY_ONLY' <<< "$report"
          grep -Fq 'BLOCKED: no isolated runner' <<< "$report"
          # This stage inventories host capabilities only; no candidate execution.
          if grep -Eq '^[[:space:]]*(go[[:space:]]+test|unshare[[:space:]]|bwrap[[:space:]])' scripts/mn001-isolation-capability-inventory.sh; then
            printf '%s\n' 'ERROR: inventory script contains an execution command.' >&2
            exit 1
          fi
      - name: Verify MN-001 approval remains fail-closed (offline only)
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/mn001-approval-status.sh
          report="$(mktemp)"
          trap 'rm -f -- "$report"' EXIT
          # A missing interpreter or crashed status script is NOT an expected
          # fail-closed result. Only the intentional exit code 1 is accepted.
          set +e
          GITHUB_ACTIONS=false LQC_MN001_OFFLINE_TEST_APPROVED=1 \
            bash scripts/mn001-approval-status.sh >"$report" 2>&1
          status=$?
          set -e
          cat "$report"
          if [[ "$status" -ne 1 ]]; then
            printf 'ERROR: unexpected offline approval status exit code: %s\n' "$status" >&2
            exit 1
          fi
          grep -Fxq 'MN001_GATE=NO_GO' "$report"
          grep -Fxq 'NETWORK_ISOLATION=BLOCKED' "$report"
          grep -Fxq 'FILESYSTEM_ISOLATION=BLOCKED' "$report"
          grep -Fxq 'CREDENTIAL_ISOLATION=BLOCKED' "$report"
          grep -Fxq 'RESOURCE_LIMITS=BLOCKED' "$report"
          grep -Fxq 'TRANSITIVE_INIT_REVIEW=BLOCKED' "$report"
          grep -Fxq 'USER_TEST_AUTHORIZATION=NOT_GRANTED' "$report"
          grep -Fxq 'MN001_CANDIDATE_TESTS=NOT_EXECUTED' "$report"
          grep -Fxq 'MAINNET=NO_GO' "$report"
      - name: Verify frozen MN-001 candidate scope without executing Go
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/mn001-offline-scope-contract.sh
          report="$(bash scripts/mn001-offline-scope-contract.sh)"
          printf '%s\n' "$report"
          grep -Fxq 'RESULT=STATIC_SCOPE_INVENTORY_ONLY' <<< "$report"
          grep -Fxq 'CANDIDATE_TEST_COUNT=8' <<< "$report"
          grep -Fxq 'MN001_GATE=NO_GO' <<< "$report"
      - name: Exercise static scope contract mutations (no candidate execution)
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/mn001-scope-contract-selftest.sh
          report="$(bash scripts/mn001-scope-contract-selftest.sh)"
          printf '%s\n' "$report"
          grep -Fxq 'RESULT=STATIC_CONTRACT_MUTATION_CHECKS_PASSED' <<< "$report"
          grep -Fxq 'MN001_GATE=NO_GO' <<< "$report"
      - name: Run all MN-001 synthetic Python security unit tests (no VM or Go)
        shell: bash
        run: |
          set -euo pipefail
          # These fixtures never import or execute LQC Go packages.
          # Evidence-format checks, import-text inventory, and VM argv policy
          # remain independent from candidate execution authorization.
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            scripts/test_mn001_evidence_bundle_check.py \
            scripts/test_mn001_go_local_init_inventory.py \
            scripts/test_mn001_vm_argv_policy.py
      - name: Run reviewed existing security preflight
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/security-preflight-linux.sh
      - name: Publish MN-001 security boundary (preflight is not approval)
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' '## MN-001 status: IN PROGRESS / MAINNET NO-GO'
            printf '%s\n' ''
            printf '%s\n' 'This job reports reviewed security preflight only.'
            printf '%s\n' 'NETWORK_ISOLATION=BLOCKED; MN001_GATE=NO_GO.'
            printf '%s\n' 'No isolated-runner proof or explicit test authorization exists.'
            printf '%s\n' 'A green verify-scripts check MUST NOT be interpreted as deployment approval.'
            printf '%s\n' 'Candidate tests, validator operations, and activation remain prohibited.'
          } >> "$GITHUB_STEP_SUMMARY"
