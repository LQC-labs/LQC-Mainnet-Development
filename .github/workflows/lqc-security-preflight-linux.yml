name: LQC isolated security preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.9'
          cache: false
      - name: Compile and exercise reviewed non-signing boundaries
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/lqc-module-sha256"
          sha256sum go.mod go.sum > "$manifest"
          trap 'sha256sum --check "$manifest"' EXIT
          bash scripts/security-preflight-linux.sh
